<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>비공개 문서</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: #f4f7fb;
      color: #1e2d3d;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #auth-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(26, 58, 92, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      padding: 20px;
    }
    .auth-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 38px 32px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.3);
      text-align: center;
      animation: modalFadeIn 0.3s ease-out;
      transition: transform 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .auth-icon { font-size: 2.8rem; margin-bottom: 12px; }
    .auth-card h2 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #1a3a5c;
      margin-bottom: 22px;
      line-height: 1.5;
    }
    .auth-input-group { margin-bottom: 14px; }
    .auth-input {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid #d0dce9;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .auth-input:focus {
      border-color: #2e7dd6;
      box-shadow: 0 0 0 3px rgba(46, 125, 214, 0.2);
    }
    .auth-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #1a3a5c 0%, #2e7dd6 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .auth-btn:hover { opacity: 0.94; }
    .auth-btn:active { transform: scale(0.98); }
    .auth-error {
      color: #e74c3c;
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 20px;
      font-weight: 500;
    }
    .auth-loading {
      display: none;
      font-size: 0.88rem;
      color: #2e7dd6;
      margin-top: 10px;
      font-weight: 500;
    }
    #app-root {
      width: 100%;
    }
  </style>
</head>
<body>
  <!-- 🔒 보안 인증 모달 -->
  <div id="auth-overlay">
    <div class="auth-card">
      <div class="auth-icon">🔒</div>
      <h2>열람을 위해 비밀번호를 입력해 주세요.</h2>
      <div class="auth-input-group">
        <input type="password" id="auth-password" class="auth-input" placeholder="비밀번호 입력" autofocus autocomplete="current-password" />
      </div>
      <button id="auth-submit" class="auth-btn">확인</button>
      <div id="auth-loading" class="auth-loading">잠금 해제 중...</div>
      <div id="auth-error" class="auth-error"></div>
    </div>
  </div>

  <div id="app-root"></div>

          ['deriveKey']
        );

        const key = await crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: salt,
            iterations: 100000,
            hash: 'SHA-256'
          },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );

        const decrypted = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: iv },
          key,
          cipherWithTag
        );

        return new TextDecoder().decode(decrypted);
      } catch (err) {
        return null;
      }
    }

    function renderContent(html) {
      document.getElementById('app-root').innerHTML = html;
      document.getElementById('auth-overlay').style.display = 'none';
      document.title = '주요 성과 정리';
    }

    async function handleUnlock() {
      const input = document.getElementById('auth-password');
      const errorMsg = document.getElementById('auth-error');
      const loading = document.getElementById('auth-loading');
      const submitBtn = document.getElementById('auth-submit');
      const password = input.value.trim();

      if (!password) {
        errorMsg.textContent = '비밀번호를 입력해 주세요.';
        return;
      }

      errorMsg.textContent = '';
      loading.style.display = 'block';
      submitBtn.disabled = true;

      const decryptedHtml = await decryptPayload(password);

      loading.style.display = 'none';
      submitBtn.disabled = false;

      if (decryptedHtml) {
        sessionStorage.setItem(SESSION_KEY, decryptedHtml);
        renderContent(decryptedHtml);
      } else {
        errorMsg.textContent = '비밀번호가 일치하지 않습니다. 다시 입력해 주세요.';
        input.value = '';
        input.focus();

        const card = document.querySelector('.auth-card');
        if (card) {
          card.style.transform = 'translateX(-8px)';
          setTimeout(() => { card.style.transform = 'translateX(8px)'; }, 100);
          setTimeout(() => { card.style.transform = 'translateX(-4px)'; }, 200);
          setTimeout(() => { card.style.transform = 'translateX(4px)'; }, 300);
          setTimeout(() => { card.style.transform = 'translateX(0)'; }, 400);
        }
      }
    }

    document.getElementById('auth-submit').addEventListener('click', handleUnlock);
    document.getElementById('auth-password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleUnlock();
    });

    // 세션 유지 확인 (새로고침 시 유지)
    const cached = sessionStorage.getItem(SESSION_KEY);
    if (cached) {
      renderContent(cached);
    }
  </script>
</body>
</html>
